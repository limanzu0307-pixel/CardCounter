name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-ipa
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Test and package
        run: bash ci/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: CardCounter-ipa
          path: CardCounter.ipa
          if-no-files-found: error
