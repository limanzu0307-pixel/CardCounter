name: Runner Check

on:
  push:
    paths:
      - .github/workflows/runner-check.yml
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - run: uname -a
